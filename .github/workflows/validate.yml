name: Validate public template

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Weekly Kanban tests
        run: python3 -m unittest discover -s skills/weekly-kanban-overview/tests
      - name: Privacy and structure checks
        run: python3 scripts/validate_public_template.py
